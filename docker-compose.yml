services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Postgres のポートは外に公開しない。アプリ経由でのみ使う。
    # ローカルで直接つなぎたいときだけ次を有効化する:
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # テールネット内公開は Tailscale Serve で行う前提で、ホスト側は localhost のみ。
      - "127.0.0.1:8000:8000"
    volumes:
      # Research リポジトリの clone（xvps 上の ~/research）を読み取り専用で取り込む。
      # アプリは reports/collect_dashboards/ の配信と pull_status.json の参照だけに使う。
      - /home/sin/research:/research:ro

volumes:
  pgdata:
